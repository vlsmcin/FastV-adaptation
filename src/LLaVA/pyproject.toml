[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llava"
version = "1.2.0"
description = "Towards GPT-4 like large language and visual assistant (modernized dependency bounds for FastV)."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "torch>=2.4.0", "torchvision>=0.19.0",
    "transformers>=4.45.0", "tokenizers>=0.19.0", "sentencepiece>=0.2.0", "shortuuid",
    "accelerate>=0.34.0", "peft>=0.12.0", "bitsandbytes>=0.44.0",
    "pydantic>=2.0", "markdown2[all]", "numpy>=1.26.0", "scikit-learn>=1.4.0",
    "gradio>=4.0.0", "gradio_client>=1.0.0",
    "requests>=2.31.0", "httpx>=0.27.0", "uvicorn", "fastapi",
    "einops>=0.8.0", "einops-exts>=0.0.4", "timm>=0.9.0",
]

[project.optional-dependencies]
train = ["deepspeed>=0.14.0", "ninja", "wandb"]

[project.urls]
"Homepage" = "https://llava-vl.github.io"
"Bug Tracker" = "https://github.com/haotian-liu/LLaVA/issues"

[tool.setuptools.packages.find]
exclude = ["assets*", "benchmark*", "docs", "dist*", "playground*", "scripts*", "tests*"]

[tool.wheel]
exclude = ["assets*", "benchmark*", "docs", "dist*", "playground*", "scripts*", "tests*"]
